services:
  - type: web
    name: shilin-ai-home-valuation
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Set ADMIN_TOKEN privately in Render Environment if you need secure upload/retrain.
